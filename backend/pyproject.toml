[project]
name = "backend"
version = "1.0.0"
description = "Production-grade full-stack habit tracking engine"
readme = "README.md"
authors = [
    { name = "tamer", email = "tamerbadawy499@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httptools>=0.9.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
